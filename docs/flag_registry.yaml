  covering_gate: "m0/m12gate PIN it to \"0\" (pre-M4 baseline attribution); m4gate A/Bs \"0\" vs the unset default \"1\" directly (Newton-floor equivalence, replay fidelity vs record, O3.1 leak detector through the args engine, warm-path band, engine-cache re-bind, V2 property rejector); m5gate/m5cgate/m6gate/h3gate never touch it and run at the unset default \"1\""
