  note: "cites docs/findings_registry.yaml:167 structure:monolithic-driver-module; PLAN_ARGS=0 combined with COLEXEC=1 (the M5c executor under the legacy constants build) is never exercised"

- flag: "A1_VMAP_HESS"
  default: "\"0\""
  meaning: "opt-in switch for the M6 batched-vmap value_and_grad Hessian-row engine inside run_trsqp's FD blocks; GATE-REJECTED as default 2026-08-12 (vmapped adjoint diverges 5.6e-8 rel from sequential, dH = 18% of Hessian scale = 5-6x the FD scheme's own asymmetry); default sequential everywhere, candidate stays opt-in for the F2 re-adjudication"
