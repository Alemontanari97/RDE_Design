    - "validation/a1_toc_variational_jax.py:1652"
  covering_gate: "m6gate exercises the UNDERLYING vg_batch mechanism, but by constructing the batched entry directly through the vg_batch=True API parameter (TV.make_run_toc_scan_jit(..., vg_batch=True)) — it never sets os.environ[\"A1_VMAP_HESS\"]. A repo-wide grep for an assignment to this name in validation/*.py returns ZERO hits: the env-gated branch at line 1652 is read at its default \"0\" by every committed script; nothing ever sets it to \"1\""
  tested_pairs: "none at the env-flag level — the mechanism m6gate measures is reached by API bypass, not by the flag; the flag's own ==\"1\" branch is dark to every committed gate/test"
  untested_cartesian: true
  note: "cites docs/findings_registry.yaml:167 structure:monolithic-driver-module (VMAP_HESS is explicitly one of the cited axes); stronger than the registry row's blanket claim — this is not merely an under-combined axis, the flag's own armed state is never reached by anything committed"

