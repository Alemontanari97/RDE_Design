# A1_* ARBITRATION-FLAG REGISTRY — S-ORDINE T2 census row T2-bis(b).
#
# PURPOSE: one row per env-read A1_* flag that actually exists in the
# committed code, so "does flag X exist / what does it default to /
# which gate exercises it" never again requires a fresh grep-and-read.
#
# CENSUS RULE (pinned, REF-16; REPAIRED 2026-08-13, S-ORDINE T2 lint
# step): a flag EXISTS iff it is READ from the environment. The
# census pattern MUST tolerate a line break / whitespace after the
# opening parenthesis — the original single-line grep missed FOUR
# line-wrapped reads (see the repair note below). Census pattern of
# record (implemented by lint group (xx),
# tests/test_advisory_index.py, over validation/*.py + tests/*.py):
#   os\.(environ\.get|getenv)\(\s*["']A1_[A-Z0-9_]+     (re.DOTALL-
#   equivalent: \s* spans newlines)
# Bare string mentions of "A1_..." in docstrings/comments/reporting
# strings are DECLARED OUT OF SCOPE — they made both failure
# directions unfalsifiable (a flag could look documented without
# being read, or read without being documented) and are excluded from
# this registry's counts and rows.
#
# CENSUS RESULT OF RECORD (2026-08-13, whitespace-tolerant pattern):
# 59 read-site occurrences across 10 files, ALL in validation/*.py,
# ZERO in tests/*.py:
#   a1_toc_variational_jax.py 13, engine_speed_bench.py 16,
#   def_twin_falsifier.py 12, adaptive_knot_optimize.py 5,
#   o33_bench.py 4, margin_governor.py 3, o32_mesh_convergence.py 2,
#   locus_diagnosis.py 2, a1_ideal_march_jax.py 1,
#   a1_loopspeed_bench.py 1.
# These 59 occurrences collapse to 45 UNIQUE flag names (some flags
# have >1 read site: A1_COLEXEC x2, A1_VG_MEMO x3, A1_TOCV_OPT x2,
# A1_GENO_CASE x2, A1_SPDB_GATE_NI/NW/DA x4 each). 45 rows below.
#
# CENSUS REPAIR OF RECORD (2026-08-13, found by lint (xx) at its
# first run): the original single-line grep census declared 55/41 and
# MISSED four LINE-WRAPPED reads — A1_LOCD_REJ + A1_LOCD_BASE
# (locus_diagnosis.py, a file the 9-file census list omitted
# entirely), A1_DEFTW_ATLAS (def_twin_falsifier.py) and A1_MGOV_BASE
# (margin_governor.py), each written as os.environ.get( <newline>
# "A1_...", default). Their four rows are appended at the end of this
# file; the whitespace-tolerant pattern above is the pinned census
# rule of record from this date.
#
# BIJECTION (stated both directions):
#   -> every one of the 59 census occurrences is listed under some
#      row's read_sites (sum of read_sites counts below = 59, checked
#      against the lint (xx) census, see per-row counts);
#   <- every row has >= 1 read_sites entry (none minted from a name
#      alone; the "known population to verify" list in the S-ORDINE
#      prompt was NOT assumed, it was independently reproduced by the
#      census — all 7 named flags appear, plus 38 more the census
#      found that the prompt did not name: A1_GENO_CASE, A1_RECORD_
#      MEMO, A1_RKG_CERTDIAG, A1_TOCV_OPT, the A1_AKN_* family (5),
#      the A1_DEFTW_* family (10 incl. A1_DEFTW_ATLAS), the A1_SPDB_*
#      family (7 incl. the x4 read sites), A1_MGOV_STAGE +
#      A1_MGOV_BASE, the A1_O32_* family (2), the A1_O33_* family
#      (4), the A1_LOCD_* pair (2)).
#
# ARBITRATION vs INSTANCE/STAGE KNOBS (declared, not re-litigated):
# only 7 of the 45 rows are genuine record-path ARBITRATION flags
# (they select between behaviorally-different code paths inside the
# driver's record/replay/margin machinery): A1_COLEXEC, A1_FUSED_CERT,
# A1_PLAN_ARGS, A1_VMAP_HESS, A1_RECORD_MEMO, A1_VG_MEMO, A1_MEMO_PROBE.
# The other 34 are standalone-script instance parameters (mesh/case
# geometry), stage selectors (which leg of a multi-stage __main__ to
# run), budget knobs (rep counts, cycle caps, wall-clock caps), or
# artifact-path knobs (where to dump a JSON for post-hoc diagnosis).
# They do not combine with the arbitration flags in gated logic, so
# untested_cartesian is scoped to the 7 arbitration rows plus the one
# reporting-only flag (A1_CERT_ARGMAX) that the docstring itself
# declares enters no gate.
#
# UNTESTED CARTESIAN PRODUCT (do not re-mint): the S25-bis findings
# registry already carries this row —
#   docs/findings_registry.yaml:167 id structure:monolithic-driver-module
#   "growing arbitration-flag matrix (A1_COLEXEC x A1_FUSED_CERT x
#    A1_PLAN_ARGS x A1_VMAP_HESS x memos) tested on gated pairs,
#    cartesian product DECLARED untested"
# Every row below with untested_cartesian: true cites that row rather
# than re-deriving the claim; the per-row note adds the SPECIFIC
# untested cell(s) this census found (finer-grained than the registry
# row's blanket declaration in three places: A1_VMAP_HESS's ==1 branch
# is never reached by ANY committed script, not merely under-combined;
# A1_RECORD_MEMO and A1_VG_MEMO are always moved TOGETHER, never
# independently; A1_VG_MEMO has two read sites — margin_governor.py
# and def_twin_falsifier.py's own margin factories — that no gate
# reaches at all).
#
# LINT: none wired yet. This is a census artifact (S-ORDINE T2-bis(b));
# a machine check (e.g. tests/test_flag_registry.py re-running the
# grep above and diffing against this file's flag list) is a natural
# S-ORDINE follow-up but is OUT OF SCOPE for this file (single-file
# task) and is not created here.
#
# SCHEMA per entry:
#   flag              A1_* name (census-verified read, not assumed)
#   default           the code's actual default arg to .get(), quoted;
#                      "None (no second arg)" when .get() takes one arg
#   meaning            one line, from the read site's docstring/context
#   read_sites         path:line list, one per census occurrence
#   covering_gate      which gate/test exercises it (m0/m4gate/m5gate/
#                      m5cgate/m6gate/m12gate/h3gate, all ONDEMAND-tier
#                      carriers in validation/engine_speed_bench.py,
#                      invoked via tests/test_ondemand_carriers.py —
#                      no FAST/RIGOR/SLOW run_all group reaches any of
#                      them); "none" when no committed script sets it
#   tested_pairs       which flag combinations the gates actually run,
#                      in prose (from the gate scripts' own text)
#   untested_cartesian true/false
#   note               required when untested_cartesian: true (cites
#                      the registry row); optional detail otherwise
#
entries:

- flag: "A1_COLEXEC"
  default: "\"1\""
  meaning: "select the per-cell legacy recorder (=0) vs the per-column compiled executor (=1, M5c) for the march/cert record path; folded into the record-context hash key (R4: the active recorder is part of record identity)"
  read_sites:
    - "validation/a1_toc_variational_jax.py:349"
    - "validation/a1_toc_variational_jax.py:1229"
  covering_gate: "m0/m12gate/m5gate PIN it to \"0\" (baseline / per-cell attribution, set BEFORE walk_start); m5cgate A/Bs \"0\" vs \"1\" directly (dec-vector bitwise, wall/seeds/min_margin inside the Newton-floor band, doctored-stack first-offender, near-seam floor-hi/floor-lo pair); m4gate/m6gate/h3gate never touch it and run at the unset default \"1\""
  tested_pairs: "m5cgate varies COLEXEC in {0,1} with PLAN_ARGS/FUSED_CERT/RECORD_MEMO/VG_MEMO/VMAP_HESS all held at their unset defaults (1,1,1,1,0) — a single-axis slice, not a joint sweep"
  untested_cartesian: true
  note: "cites docs/findings_registry.yaml:167 structure:monolithic-driver-module; COLEXEC=1 combined with FUSED_CERT=0, PLAN_ARGS=0, or memos=0 is never exercised by any committed gate"

- flag: "A1_FUSED_CERT"
  default: "\"1\""
  meaning: "gate whether the PER-CELL cert path uses the fused solve_cert entry; per R3 (RF-6) the flag is honored only at per-cell sites — the column executor always inlines the fused entry regardless of this flag's value"
  read_sites:
    - "validation/a1_toc_variational_jax.py:348"
  covering_gate: "m5gate A/Bs \"0\" vs the unset default \"1\" (fused-vs-legacy wall bitwise + cert_worst equality + timing), always under the m5gate attribution pin A1_COLEXEC=0; no other gate touches it"
  tested_pairs: "{COLEXEC=0, FUSED_CERT=0} vs {COLEXEC=0, FUSED_CERT=1} inside m5gate; the FUSED_CERT x COLEXEC=1 cell is never exercised (m5gate pins COLEXEC=0 by design, m5cgate never varies FUSED_CERT)"
  untested_cartesian: true
  note: "cites docs/findings_registry.yaml:167 structure:monolithic-driver-module; FUSED_CERT=0 at COLEXEC=1 is a specific untested cell this census located"

- flag: "A1_PLAN_ARGS"
