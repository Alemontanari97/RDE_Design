# CODENAME GLOSSARY — census T2-bis(a), S-ORDINE (census R32, 2026-08-13).
#
# PURPOSE: disambiguate the codename-token namespace collisions measured
# across the Phase-1 inventory (segments 1-7) and give a navigable index
# into WHERE each meaning is of record. This file does NOT re-state
# content: every entry's `resolver` points at the doc/registry/anchor
# that carries the actual definition/proof/verdict.
#
# HONEST-SCOPE (verbatim, per the S-ORDINE T2-bis(a) contract):
# "payoff = collision disambiguation + navigation; NOT anti-re-mint
# machinery (that is the findings-registry dedup clause's job)."
# This glossary does not enforce uniqueness of findings/claims and does
# not gate commits; docs/findings_registry.yaml (R31, lint group xix)
# and docs/claims_registry.yaml (lint group xv) remain the only
# machine-enforced anti-re-mint / index authorities.
#
# DESIGN (pinned by the converged S-ORDINE plan):
# - Every entry id is NAMESPACE-QUALIFIED (namespace:token) because the
#   same bare token (e.g. "C1", "M1", "T2", "F4", "O5", "P1", "A1",
#   "B1", "L4", "U1..U4") carries 2-5 UNRELATED meanings depending on
#   which document minted it.
# - PREFIX-FAMILY RULE (anti-bloat, plan directive P1-12): any token
#   family that resolves to a REGISTRY ROW (findings_registry ids,
#   choice-ledger C<n>, gap-map GAP-<n>, census R<n>, claims [X-*]/
#   [T-*]/[S-*]/[C-*]/[D-*], AUDIT/DUTY/RT/ISS/ATT/V/N/CEN-O/AC/Q
#   enumerations, literature identities) gets ONE `family` entry
#   pointing at its registry/document as resolver, NOT one row per
#   member. Full individual `entries` rows exist only for (a) collision
#   tokens — each distinct meaning of an ambiguous bare token — and
#   (b) unregistered standalone tokens (terms of art, constants,
#   directives, session names) that are not indexed anywhere else.
# - Target: a navigable file, NOT a 700-row dump. This file has
#   32 family rows (covering ~450+ individual registry-member tokens
#   by reference) + 131 individual entries (collisions + standalone) =
#   163 total rows (machine-counted: len(families)+len(entries), see
#   MERGED N below; 24+116=140 at first build, +8 families +15 entries
#   from the seg8 merge, 2026-08-13 S-ORDINE T2 lint step).
#
# SOURCES (Phase-1 inventory codename-token tables; per-source counts
# as declared or, where the reader gave no single total, as counted
# from that segment's own token table — method stated per row):
#   seg1 (docs core)                : 214  (reader-declared total)
#   seg2 (code/data/root)           :  31  (row-count of §I table; no reader total declared)
#   seg3 (advisories A, 17 files)   : 178  (reader-declared total)
#   seg4 (advisories B, 17 files)   :  96  (row-count of the CODENAME TOKEN TABLE; no reader total declared)
#   seg5 (session logs + artifacts) :  78  (reader-declared "distinct token families")
#   seg6 (persistent memory, 37)    : 231  (reader-declared total)
#   seg7 (literature, 137 files)    :  70  (row-count of the numbered CODENAME TOKENS list; no reader total declared)
#   seg8 (supplement, 64-file delta):  34  (row-count of the CODENAME
#     TOKEN COLLECTION table of `validation/sordine_raws_2026-08-13/
#     inventory_seg8_supplement.md`; the inventory did not exist at
#     first build [the ABSENT note of record], it landed with the S0b
#     supplementary pass; merged 2026-08-13, S-ORDINE T2 lint step)
#   RAW SUM (per-source, pre-dedup, double-counting every token that
#     recurs across segments — R1-R6, G0-G6, EQ-v2, KAT, GAP-5, GAP-29,
#     REQ-NONSTALL, M0-M6 etc. each appear in 4-7 segment tables):
#     898 + seg8 34 = 932 (updated 2026-08-13).
#   MERGED N (this file, machine-counted post prefix-family collapse +
#     cross-segment dedup of identical-meaning tokens): 34 family rows
#     + 137 individual entries = 171 total rows (F-SERVICE window
#     reconciliation 2026-08-13 added 2 families [B-F<n>, RF-<n>] + 6
#     entries [F-SERVICE, S-FOUNDATIONS, T-DISC, T-RED, M-RED,
#     R22-CFD] for the 11 post-baseline tokens, SR-4; 163 before that;
#     140 at first build;
#     seg8 merge added 8 families + 15 entries, the other 11 seg8 table
#     rows dedup onto existing rows/families: PB-2, T-T3*, T-T4, EQ-v2
#     to existing entries/families; R16/C30/C31-C32/S1-S3-as-adoptions/
#     gap-G-d rows are members of the new litreview enumerable families;
#     D0-D5 folds into the SOTA-<n> family note). The reduction
#     (932 -> 163) is entirely accounted for by: (i) the same token
#     counted once per segment that mentioned it (R1-R6 alone was
#     counted in all 7 segment tables); (ii) enumerable registry
#     families (GAP-1..36, C1..C45, DUTY-1..15, AC1..16, etc. — ~450
#     individual member tokens across the raw sum) collapsed to 24
#     family rows; (iii) low-value single-mention tokens (e.g. one-off
#     probe ids, GENO figure filenames) not carried forward — this is
#     the declared, non-bloat cut, not a silent loss (the source
#     inventories remain the ledger of record for those).
#
# VERIFICATION (collision families named in the S-ORDINE contract —
# each has >= 2 disambiguating `entries` rows below; count given):
#   O5 (2): oracle:O5, decision:O5
#   M1 (2): speed-lever:M1, mechanism:M1
#   T2 (2 within T1/T2 group of 4): gate:T2, theorem:T2
#   F4 (2): plan-phase:F4b, falsifier:F4
#   C1 (5): claim:C-1, choice:C1, panel:C1, conditional:C1, audit:C1
#   L4 (3): doc-layer:L4, speed-lever:L4, class:L4-default
#   U1-U4 (7): conditional:U1..U4 (4) + duty:U1..U3 (3)
#   A1 (3): plan-phase:A1, flag:A1_*, topology:A1
#   P* (7): triage:P0-P2, paper:P-1, paper:P-2, problem:P1-P7,
#            pin:P1-P3, lever:P1-P4, book:PB-1..PB-4
#   B1 (3): brick:B1, rung:B1, quarantine:B1
#   T1/T2 (4): theorem:T1, gate:T1, theorem:T2, gate:T2
#   F1-F7 (4): plan-phase:F1b, falsifier:F1-F7-deftwin,
#              falsifier:F1-F4-swirl, falsifier:F1-F4-collapse
#   BONUS collisions surfaced during seeding (not in the pinned list,
#   disambiguated anyway because >=3 segments independently flagged
#   them): G1 (3: gate:G1, term:G1-surrogate, claim:G1-DISC),
#   M0 (2: doc:M0, speed-lever:M0). Q is ALSO overloaded (gap-map
#   Q1-Q11 vs speed-audit Q1-Q6, two unrelated quarantine lists) but
#   is disambiguated at the FAMILY level (two separate `family` rows
#   "Q<n>* (gap-map quarantine)" / "Q<n>* (speed quarantine)" with
#   cross-reference notes) rather than as individual `entries` rows,
#   since every member is itself registry-enumerable (prefix-family
#   rule applies).
#
# NAMESPACES used below (extends the plan-directive seed list
# plan-phase:/census:/gate:/gap:/claim:/choice:/flag:/memory:/oracle:/
# tier: with the additional ones this corpus actually needed):
#   plan-phase, census, gate, gap, claim, choice, flag, memory, oracle,
#   tier, session, doc, theorem, hypothesis, conditional, directive,
#   audit, topology, speed-lever, panel, duty, falsifier, literature,
#   decision, probe, term, brick, rung, quarantine, mechanism, constant,
#   config

