  statement: "A walk started ON the reference profile that stays there certifies the stationarity of that point -- a property of the point, not of the tool's capacity to find it; in production the optimum is unknown, so the only certificate that counts is the one that does not use it as a start. Three tests: RE-1, re-obtention from a reference -- the SAME initial-value line and functional as the reference, GENERIC starts (the fan's streamline, a cone, random knots; several, not one), the landing on the reference contour within the measured stay class AND on the value within the band on a move; RE-2, self-re-obtention -- a design D* the tool found, perturbed GROSSLY (inches, or a restart from the fan; not within the instrument's bands), returned to in contour; RE-3, coincidence across starts -- landings from N starts coinciding in contour within the class, and where they do not, the value spread against the band on a move telling the tool (start-dependent: defect) from the problem (flat valley: declared). RE-2 and RE-3 are the only certificate available in a real problem; RE-1 on twins that carry their own initial-value line calibrates it. Where the functional does not discriminate contours the certifiable statement is re-obtention of the VALUE within the band, the contour ambiguity being declared as the problem's -- or the functional enriched until it discriminates. Prerequisites: the class constraint active in the driver; a resolution at which the band on a move discriminates; for RE-1, the reference's own initial-value line."
  doc: "validation/PROGRESS_2026-09-21_S32_throat_kernel.md#19. The certification criterion"
  proof: "validation/PROGRESS_2026-09-21_S32_throat_kernel.md#THE THREE TESTS"
  inherits: []
  carrier: ["X-HMPH", "X-OWS3"]
  suffices_symbolic: "n/a"
  falsifier: "a row that calls an optimum CERTIFIED on the strength of a walk started on the reference profile (a stays test) or of a perturbation inside the instrument's own bands (a basin test) is NONCONFORMING; a landing that matches the reference in value but not in contour, where the functional discriminates contours, is a FAILED re-obtention; RE-3 disagreement across starts with the value spread inside the band on a move is a declared flat valley, outside it a defect of the tool. As of 2026-09-22 no row of the line certifies the optimiser as a finder: X-HMPH holds a stays test, a basin test and one failed re-obtention (value -0.19 percent, contour y_D 2.72 vs 0.954 in), X-OWS3 a basin test."
  gamma: "n/a"

