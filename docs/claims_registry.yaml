# claims_registry.yaml — THE CLAIM REGISTRY (theory-as-code)
# ============================================================================
# Created 2026-07-17, session S9, [F1/SCAFFOLD-M] task M-1
# (docs/rde_nozzle_SCAFFOLD.md §2 seed, COMPLETED against the real tree;
#  completion deltas declared in validation/PROGRESS_2026-07-17_S9_ordine.md
#  step 4). This file is the INDEX of the theory corpus (SCAFFOLD §1, layer
#  L2 mirror): one entry per citable object; it never carries content — the
#  normative statements and proofs live in the referenced documents.
#  Machine-checked by tests/test_claims_lint.py (suite group (xv)).
#
# SCHEMA (SCAFFOLD §2, exact field set):
#   id, kind, class, scope, statement, doc, proof, inherits, carrier,
#   suffices_symbolic, falsifier, gamma
#
# ENUMS AND CONVENTIONS (deviations from the seed DECLARED, structure-only):
#   kind:  theorem | definition | conditional | conjecture | schema |
#          carrier | oracle | directive | paper
#          (`paper` is a declared extension: the S9 project order mandates
#           registry IDs for the paper-layer documents of record.)
#   class: THEOREM | THEOREM* | SCHEMA | CONJECTURE | PRACTICE
#   gamma: EOS-general | gamma-const-oracle | perfect-gas-oracle | n/a
#          (`n/a` admitted ONLY for kinds directive/paper and for declared
#           non-mathematical carriers (code lint); enforced by the lint.)
#   class-on-definitions convention (DECLARED S14, [PAN-S14] F-CLASSES):
#          for kind: definition the class records the rigor status of the
#          definitional CONTENT — exact definitions of record = THEOREM,
#          empirical-criterion definitions = PRACTICE (cf. D-GSEP).
#   suffices_symbolic: yes | no | n/a
#          (yes = finite algebraic identity, machine check = proof;
#           no = function-space content, analytic steps named;
#           n/a = not a mathematical claim. THEOREM with yes REQUIRES a
#           nonempty carrier; enforced by the lint.)
#   doc/proof: "path" or "path#anchor" where anchor is a literal substring
#          of the file (lint-resolved). carrier: list of carrier-entry IDs.
#          inherits: list of conditional-entry IDs (THEOREM* must be
#          nonempty; model closures and numeric residuals are conditional
#          entries too, justified per SCAFFOLD §3 rule 4 in their scope).
#
# STRICT YAML SUBSET (parser in tests/test_claims_lint.py; PyYAML, when
# present, is used as a dual-route cross-check): top-level `entries:` list;
# items start with `- id:`; scalar values double-quoted or bare single
# tokens; lists inline `["a", "b"]` or `[]`; comments only on full lines.
# ============================================================================

