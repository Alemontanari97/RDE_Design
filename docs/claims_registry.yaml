  statement: "S34-S35 (2026-09-23/24): the twin's thrust rows are READ IN CLASS on Humphreys' region R (stage mderive HMPH_MREGION=R 9/9); from THEIR throat the optimiser re-obtains Table 2 (X-TPOS), Table 4 is re-read on the Panov-Shvets-at-D convention (X-TPOS), their Rao nozzle is posed in Rao's world (X-RAOHM, stage raogeno 2/2) and Fig. 4 is a reading only (X-TPOS stage fig4). HISTORY BELOW. CERTIFICATION CLASS under [DIR-REOB] (2026-09-22): STATIONARITY / BASIN, NOT a finder certificate -- the table-start landing is a stays test, the +0.30-in return a basin test whose tip did not return, and the one re-obtention attempted (from the fan's streamline) PASSED in value (-0.19 percent) and FAILED in contour (y_D 2.72 against 0.954 in); all three on marches since found out of class (stage class). What follows is the record as written. Read of record (stage rao, cert 0.037): at their lip and PR the ideal member exhausts at M_e 2.8495, q_e 2277.5 m/s, so mdot q_e = 34,390 lbf is the IDEAL BOUND of their posing -- Rao's length-constrained member sits 0.4 percent below it, their fixed-inlet optimum 4.4 percent (0.2 of which is shear). The ideal member at lip 8.33 in passes 137.8 lbm/s (-7 percent of their 148.08; at 7.55 in -24 percent), independent of the fan's M_i because the exit fixes it (rho_e q_e pi R_lip^2): with their mass and those lips the IDEAL member does not exist -- both of their members have non-uniform exits (p > p_a at D) and pass more mass than a full expansion allows at that lip. The truncated ideal member with Veen base reads 34,255 lbf against Rao's 34,253 only with THEIR mass in mdot q_e: a coincidence of the bound, not a twin (R-2 as posed is the bound; R-1/R-3 are not rows). The twin proper is stage opt: from the fan's streamline the Rao case starts at 33,473 lbf (-2.3 percent) with y_D 3.2 in and the walk must bring the base down to 1.375 in; the legs closed (30 segments, 2032/2052 s): rao 33,780 lbf (-1.4 percent, O-2 FAIL at 1 percent, cert 0.510, y_D 2.11 in vs Rao's 1.375), opt 32,666 lbf (-0.65 percent, O-2 PASS, cert 0.522, y_D 3.47 in vs their 0.954). The thrust rows read the FLAT VALLEY (their own grid within 0.5 percent, their base swap x2.45 in y_D at +0.26 percent), not the contour: in the Rao case the walk follows Table 3 to ~0.2 in up to x 8 in then lifts its tip; in the opt case it ends fat at the same thrust. Causes of posing: the walks unconverged (radius 1e-2 R, rejections from segment 23) and the inlet -- a planar fan with the mass imposed through the start radius is not their sonic throat at the lip (y_w0 6.24/6.04 in at X0 0.38 in vs their foot 7.61/6.72 in at x -0.6): the throat kernel on the contour is the brick. Of record on the side [CORRECTED S33, stage rao R-4/R-5, 2026-09-22: S31 had read by eye that Table 3 lies ON our exact ideal member; measured row by row it runs BELOW it at every row, -0.086 in near the lip growing monotonically to -0.258 in at D (1.3 to 18.7 percent of the local radius), their wall angle steeper by 0.15-0.95 deg -- the length-constrained optimum runs close to and systematically below the truncated ideal member, not on it; and the paper misprints one angle, -12.27169 for -22.27169 at x 5.33714] -- while that member passes 137.8 lbm/s against their 148.08: a 7 percent discrepancy in THEIR mass convention to read before judging thrust at 1 percent. THEN, FROM THEIR CONTOUR (HMPH_START=table, humphreys1971_tables.json; the record's O3.3 pattern): at their optimum our functional reads 32,765 lbf (-0.35 percent, their shear 0.2) and the walk STAYS -- +0.3 percent, knots within 0.05-0.15 in of Table 2 but the first (+0.34 in at the lip, the planar inlet) -- landing at 32,864 lbf (-5e-4) with Veen and 32,885 (+1e-4) with the ambient closure (the closure worth 21 lbf and 0.055 in of y_D at this optimum, whose base is small); the fan-start walk's fat contour was an unconverged walk parked 0.6 percent lower in the flat valley. Rao's case from Table 3: stays (+0.13 percent, y_D 1.44 vs 1.375) with the -1.3 percent offset of the 8.33-in posing (their mass). CLOSED on the optimum case (O-0/O-1/O-2), OPEN on the Rao case's mass offset. S32 (2026-09-22): RETURN FROM PERTURBATION -- Table 2 + 0.30 in seeded on every knot, backtracking driver: the value returns (32,869 lbf, -3.7e-4; the unperturbed landing 32,864), the interior knots return to 0.001-0.06 in, the tip does not move (its gradient is nil with the Veen base: the flat valley IS the tip) and the second knot returns by half; from segment 7 on every trial fails certification marginally (cert 1.5-22, the Newton's round-off floor one decade above the strict metric) and the walk parks at |grad| 1.2e5 -- the certification floor of S31 section 3.3, measured as what ends walks in the flat valley; P-1 (delta/3) FAILS on the tip and the second knot. STAGE grad (S32, 2026-09-22, the gradient AT the optimum, no walk; two rungs of the ladder, 4/5 then 5/5): the price of a first-order move is graded against the band the march supports ON A MOVE -- K_RICH x the amount by which the refinement moves the DIFFERENCE between two designs -- and not against the band on the value, the discretisation error being COMMON to designs of the same family on the same grid: at their contour the value moves 241.6 lbf under (81,41) -> (161,81) (band 966.6 lbf, 2.9e-2 of J, five times the span of the paper's own 20-run grid) while the difference our-landing-minus-their-table moves 31.0 lbf (band 124.2) and, one rung up, 12.2 lbf (band 48.6 lbf = 1.5e-3 of J, BELOW their grid's 178 lbf: our machine discriminates designs finer than their own grid did). Readings: (G-1) at their optimum the reverse-AD gradient matches central differences to 1e-3..7e-1 against the FD ladder's own scatter, at BOTH rungs -- what ends the walks is not the gradient; (value) J at their contour reads 32,765 / 33,007 / 33,133 lbf on the three grids, increments 241.6 then 126.1 (ratio 1.92, first order, Richardson limit about 33,270 = +1.2 percent above their 32,881, 0.2 of which is their shear): the ABSOLUTE value is not grid-converged and the S31 '0.3 percent' reading was in part the grid error, while the DIFFERENCES the walk uses are; (G-5) the landscape IS resolved where the value is not -- the price of a stay-class move changes by at most 15.2 lbf (first rung) and 5.5 lbf (second) under (K,N) -> (2K-1,2N-1), the inlet knot's price converging 97.3 -> 82.1 -> 76.6 lbf; (G-2/G-3) THEIR CONTOUR IS STATIONARY FOR OUR FUNCTIONAL IN SHAPE -- the five shape knots buy 5.6-13.7 lbf over their whole measured stay class (0.15 in), an order below the band -- and THE ONE LIVE DIRECTION IS THE FROZEN INLET, 82.1 lbf against the band 48.6 (at the coarse rung 97.3 against 124.2, G-3 FAILING: the gate flips with the rung, the price converging and the band shrinking 4x); (G-4) the 0.134-in tip residue the perturbed walk left is worth 2.5 / 1.5 lbf, an order below the band -- the walk does not restore the tip because nothing pays for it, which is the P-1 failure read at the gradient. OPEN and declared: at (161,81) the record on THEIR contour does not certify (cert 2.96e8) while both of our landings do (0.192, 1.593), so per G1 the second rung is a reading until that 3e8 is attributed (near-lip conditioning vs a genuine fold, the geometric margin [X-PMRG] deciding it): the gate that decided G-3 is itself gated by the certification floor, on which the owner has taken S31 section 3.3's option (b) -- the cell in a rotated frame. STAGE class (S32, 2026-09-22, 5/5, the attribution): the two certification failures of this row are NOT the same mechanism -- the 1.5-22 band that parks the walks is NOT a fold (at the perturbed landing's worst cell, wall 25 at cert 3.495, the adjacent resolved census cell carries margin +0.5651: a healthy neighbourhood, the near-wall conditioning of S31 section 3.3, which the rotated-frame cell addresses) while the 2.96e8 at the finer rung IS a fold (19 folded cells in its own column), and the folded fraction is grid-stable (28.78 percent at (81,41), 28.86 at (161,81), band 0.17 pp: the DESIGN's fold, not the net's). AND, THE FINDING: THE THRUST ROWS OF THIS TWIN REST ON FOLDED MARCHES. The incumbent of the posing (the fan's own streamline) is clean, 0 of 852 resolved cells, so the criterion discriminates; the paper's own contour marched with OUR frozen planar inlet folds over 28.78 percent of its resolved cells, our table-start landing over 6.39 and the perturbed landing over 12.22. By this line's own S29 precedent ([X-PGRS] re-stamped OUT OF CLASS on exactly this reading, the certification being blind to a folded net) the S31/S32 readings on their contour -- 'reads their thrust to 0.3 percent', 'the walk STAYS', the -5e-4 landing, and the stage grad prices and bands taken at those designs -- are OUT OF CLASS and are to be re-taken with the class constraint: the driver has carried it since S29 (run_trsqp(margin=...), the phase-1 restoration) and opt() calls it without. WAVINESS IS THE FOLDING MECHANISM (K-10, the owner's reading from the figures 2026-09-22; WITHDRAWN AS 'THE' MECHANISM IN S33 -- K-10's own falsifier fired on stage angle: an ordered landing with NO turn folds 31 percent of its resolved cells; the mechanism is net compression, of which a turn is one instance): the characteristics see the wall's DIRECTION, and a turn in the wall angle is an expansion/compression alternation whose compression halves cross the net -- measured across the pool, 0 turns / 0.00 percent folded (the incumbent), 1 turn / 6.39 (our landing), 3 turns / 12.22 (the perturbed landing), 3 turns / 28.78 (their Table 2 through our cut), 5 turns (the fan-start landing, not censused). The incumbent is 26 deg rms in angle from their contour -- a different shape entirely -- and folds NOTHING: it is not distance from the optimum that folds a net but waviness. THEIR OWN angle column is monotone, so the waviness is the posing's: a six-knot spline in y pinned at a start radius that is not theirs cannot approach their contour without wiggling (K-7/K-8), and OUR LANDINGS carry the defect too. [CORRECTED S33, stage angle A-1c/A-2: from THEIR own start T the y basis holds their contour without a turn as well as the angle basis, and from OUR cut no non-turning wall reaches it -- the PRIMARY defect is the INLET, the parametrisation deciding what a walk does about it; the sentence as written follows] The PRIMARY defect is therefore the parametrisation, not the driver's missing class constraint: Humphreys take the WALL ANGLE as the independent variable (p. 1585), which cannot wiggle when ordered, while the class constraint only rejects wavy designs after the fact -- both are needed, since with the constraint alone the walk may be unable to move near their optimum, every admissible neighbour being wavy. The inlet therefore rises from 'the one live direction' to the suspect for the fold as well -- the incumbent whose inlet is consistent with the fan by construction is the clean one. WHERE THE FOLD COMES FROM (K-6/K-7/K-8): the mass-set start radius puts our wall +0.33 in ABOVE their wall at the cut (5.960 vs 5.627 in), the deviation peaks at +0.375 in at x 0.92 and the first knot is only at x 2.22 in, so their steepening turn -- which in their own table happens UPSTREAM of our cut (steepest at x -0.48 in, monotone thereafter) -- is re-done INSIDE the marched field (ours steepest at x 1.47 in) with the first folded column at x 1.88 in just downstream; and the wall ANGLE, which is what the characteristics see, oscillates about their printed angle by +10.47 / -11.85 deg (rms 4.14, five crossings, three turns) where theirs is monotone -- at M 2-3 the Mach angle is 20-30 deg. The fold reaches what this row argues about: of the 3496 lbf of wall push in J (the rest being the momentum through the cut, fixed by the imposed mass), 1745 lbf -- 50 percent -- lies DOWNSTREAM of the first fold, against the 178 lbf span of the paper's own grid. Declared with it: their Table 2 is twenty rows with gaps to 2.66 in AND a printed wall angle, and the S31 posing read y by straight chords, which on a convex contour rides ABOVE it by +0.005..+0.030 in at the knots; read_table (HMPH_TABLE, default chord = bit-identical) reads it as the cubic Hermite through their (x, y) with their own angle as the slope, for the in-class re-take. (K-9) WHY THE CUT IS NOT ON THEIR WALL: their Table 2 is the contour of their optimum in twenty (x, y, wall angle) rows from the plug throat point A -- the foot at (-0.56069, 6.71874) in, -36.25 deg, where the plug meets their start line AE -- to D at (11.51707, 0.95441), -13.26 deg; a march of characteristics cannot start at A (the sonic line is ill-posed as Cauchy data, cert 1e18, and the near-vertical characteristics past it do not certify), so the record starts from an idealised PLANAR corner fan read on a vertical cut, and that fan is not their throat: with the wall AT their contour at the cut (5.746 vs our 6.037 in) it would pass +19.2 percent mass and +25 percent inlet momentum. The cut can hold THEIR MASS or THEIR WALL, not both; the record holds the mass and pays with the geometry. Holding both is the kernel brick. STAGE throat (S32 evening, 4/6, the two FAILs being the findings): Table 2's crowded foot rows are the paper's PRESCRIBED arc (p. 1585-1586) -- radius 0.5000 in over eight intervals against their 'downstream radius of curvature of 0.5 in.', ending at T = (-0.48331, 6.64846) with T -> D = 12.0004 in against their 12.0 (two known answers of the transcription) -- and the start line A -> E (h 1.0027 in) is normal to the injection to 0.01 deg. The throat's Dutton R_c from the paper's OWN 'mean radius of curvature at the throat of 0.705 in.' is 0.705 / 1.0027 = 0.703 (the first reading of the day, R_c ~ 1 from the downstream arc, is corrected), BELOW the kernel's declared convergence domain (T-4 FAIL), yet measured AT that throat the series converges with a truncation ratio 0.73 (K 0 split: throat-plane Mach 0.971..1.208, W/W* 0.9947, first all-supersonic line at +0.03 d with M 1.00..1.25 and theta -1.5..+1.5 deg; the K 1 split is stretched, ratio 0.76, W/W* 0.9645). THE MASS: their 148.08 lbm/s is 1.029 times the choked 1-D mass of the line A -> E (44.95 in^2, 143.89 lbm/s at their p_c, T_c, R, gamma), which no line of that area can exceed -- their stated mass exceeds what their stated geometry can pass by 3.4 to 6.7 percent (T-6 FAIL): the S31 mass-convention item with a number. Consequence: a kernel on their geometry passes ~143 lbm/s by their own inconsistency, so the geometry-faithful twin compares SPECIFIC thrust, not J. STAGE kernel (S32 night, the march from their throat on their geometry: the annular kernel's line, the lip corner fan through its field, the rotated-frame cells, the wall = their arc then Table 2): the pipeline RUNS to D where on Chutkey's external plug it folded at 1.7 mm -- fan certified 0.014-0.016, start line space-like +5.8..+13 deg, march certified 0.04-0.08, y_D theirs, the mass through the cut 139.5-141.6 lbm/s = 0.969-0.984 of the choked 1-D of A -> E (the third route to the reading of their 148.08 = 1.029) -- but the march REJECTS the three-term series at its first column, -5.7 to -7.4 percent of the mass, then drifts to -8..-13 by D, with 3-5 percent of resolved cells folded. Eleven runs attribute it: not the wedge (0/2/10 rows), not the fan (25/49 rays), not the rows (41/81), not the wall's slope at A, not the wall mismatch (the kernel's own parabola loses the same 7.2 percent), not the cut (z 0.06..0.40 moves it 5.7..3.6 percent, never to the class); the SAME pipeline on the kernel's own wall at R_c 4.0, where the series converges, steps 1.2 percent and holds the mass (certified 0.84). The step is the series at a sharp throat -- CORRECTED 2026-09-22 late night by the eta ladder, the re-summation parameter being the lever on the truncation (eps = 1/(R_c + eta)): eta 2/4/6/8 (eps 0.370/0.213/0.149/0.115) step -7.38/-5.94/-5.08/-4.57 percent with the folded fraction collapsing 23.6/18.0/10.3/6.6 and the drift after the first column nearly vanishing (0.62 -> 0.11 percent: at eta 8 the march takes its step and HOLDS), so the truncation is a real part of it and eta buys a lot -- but it is NOT the O(eps^3) residual and eps is NOT the governing parameter: eps^3 falls by 34 from eta 2 to 8 while the step falls by 1.6, and at EQUAL eps the R_c-4 control (eps 0.167) steps 1.2 percent against 4.6 at R_c 0.703 with eps 0.115 -- smaller parameter, four times the step, the difference being the transverse gradient (M 1.04-1.55 against 1.12-1.28). The floor at R_c 0.70 is OPEN; what the R_c-4 control still separates is the series from the hand-over, the pipeline being sound where the throat is smooth. The series is the throat's upstream condition, not its start line, and the transonic region is to be solved numerically -- once per (lip, injection angle), outside the SQP loop, since Humphreys fix the geometry upstream of BT and let T slide on the prescribed arc. J/mdot +2.0..+3.1 percent above theirs on those marches is recorded, not cited. STAGE angle (S33, 2026-09-22 evening, log validation/PROGRESS_2026-09-22_S33_angle_param.md): the driver's PSPL_PARAM=angle takes the wall ANGLE as the independent variable (increments knot to knot from the cut's flow angle, the slope linear between knots and integrated exactly, W >= 0 by bounds: a turning wall is not representable; angle_free = no bounds; y = the record, bit-identical). Readings: inside the stay class the y basis turns in 11 of 12 random draws, the ordered angle basis in none; the incumbent in angle coordinates is represented at second order (0.066 -> 0.001 in over m 6..48), certified 0.034, 0 folded; AD = FD to 1e-4 of bands ~0.7. The fan-start walks of the S32 posing (30 x 8, backtrack 3) land at 33,308 lbf (ordered, 0 turns, y_D 3.74 in) and 33,353 lbf (free, 1 turn) -- +1.30/+1.44 percent above the paper and +543/+588 above their contour on the same grid -- ON FOLDED MARCHES (30.96 / 37.03 percent of resolved cells): OUT OF CLASS, NO GAIN (the S29 precedent). The anatomy: J = F_in 29,290.6 + push 2,552.6 + base +1,465.2 lbf for the ordered landing against 29,290.6 + 3,495.8 - 21.4 on their contour -- a +40 deg up-turn in the last knot interval compresses the wall flow to 7.58 p_a at D (M 1.68) and the Veen closure, read on that folded state, returns p_b 3.27 p_a on a 3.74-in base (the line's closed-wake data: 0.5-1.1 p_a); every folded column lies in that interval; the free walk finds the same lever. So the lever of the walks is the FUNCTIONAL's (the base closure fed by a compressed state at D), not the representation's; the class constraint is the only thing between the walker and it, and with it active the optimum is expected margin-active at the tail. Next: the margin's constants derived on this posing and the walk with margin= in ordered angle coordinates; then the base closure's domain. STAGE kernel WITH THE START LINE ON A CHARACTERISTIC, and STAGE kab (S33 night, the owner's 'why must our IVL be a vertical line?'): plug_march's columns are C+ lines built bottom-up from the wall (its rows C-), so the start line of the column family is a C+ from the plug wall to the jet boundary -- HMPH_IVL=char: the C+ through the kernel's field from the cut's wall point to the leading ray, the corner fan's own C+ line n_pts, and the free-jet triangle solved with the rotated cells; HMPH_EDGEFILL seeds the first column's edge wedge (both additive, the default rerun reproducing S32 to the printed digit). MEASURED at their throat, eta 8, z 0.12: the vertical cut's first-column step is -4.57 percent at BOTH rungs (K 160 / N 41 and 319 / 81) -- STRUCTURAL, the hand-over of a non-characteristic start line to the C+ column -- of which the edge wedge is 0.57 points (edge_fill 5 and 20: -4.01 / -4.00); with the C+ start the step is -0.12 percent and the mass holds to +0.5 percent at D (H-3 PASS); the R_c-4 control goes -1.20 -> -0.04. THE S32 ATTRIBUTION OF THE STEP TO THE SERIES IS WITHDRAWN. What replaces it is not a closure: the C+ must cross the whole transonic triangle and meets the leading ray at z ~1.0 (x' 0.36 in), where the three-term series is outside its reach -- the series' discharge is 0.992 on the throat plane, 0.988 on the cut, 0.968 along the C+ (a 2.5-percent series band, beside the eta spread on the cut 0.976..0.988), only eta 8 poses (at eta 2/4/6 the fan's first ray lands below the leading ray at the junction, z 0.7-0.9; z 0.25 at eta 8 likewise), and stage kab's A/B on THEIR wall beyond 2 d at two rungs finds the two poses NOT the same problem: the C+ pose's wall pressure exceeds the cut's by 1.25e-3 p_0 on average, 1.97e-3 at worst, outside the ladder's band on the difference (9.8e-5 there, 2.6e-4 at most) at every station, of the sign of the mass each march carries at D (133.6 vs 140.0 lbm/s), and the C+ march folds more (9.4 vs 2.2 percent at the finer rung; the folded fractions FALL under refinement in both poses, 3.12 -> 2.21 and 14.60 -> 9.40, unlike the design's folds of stage class, so part of them is the net's and a third rung is owed before either pose is called out of class on the folds). Neither pose is in class; neither discharge is certified. Specific thrust on their contour, recorded not cited: J/mdot 228.5-228.9 lbf s/lbm, stable across two poses and two grids, +2.9..+3.1 percent above their STATED 148.08 lbm/s (which their geometry cannot pass, T-6: three channels -- their mass 1.029 of the choked 1-D of A -> E, our discharge 0.968-0.988 of it, our specific thrust +3 percent -- are one fact), +0.01..+0.15 percent over their thrust per choked 1-D mass of A -> E; whether the row closes on that reading is the owner's call -- and under G1 it cannot close on it while these marches fold (2.2-14.6 percent of their resolved cells): the agreement is a READING until the folds are shown to be the net's (a third rung) or removed by the margin in the driver (S33 log section 10). The binding constraint is now explicit: the start line must be a characteristic of the march AND lie in a field that satisfies the equations over the whole transonic triangle -- the numerical transonic solution of their throat (S32 queue item 4) gives both."
