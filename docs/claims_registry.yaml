  statement: "The classical base-pressure family cannot arbitrate a truncated plug at any length, and the numbers say so on our own member: at the shared caps 12.5 / 25 / 37.5 / 50 / 62.5 / 75 / 87.5 percent of the length the SPREAD across admissible closures is 7.03e+06 / 3.13e+06 / 1.60e+06 / 6.62e+05 / 2.68e+05 / 8.51e+04 / 1.70e+04 N against truncation losses of 3.50e+06 / 1.41e+06 / 5.91e+05 / 2.39e+05 / 8.84e+04 / 2.62e+04 / 5.47e+03 N -- a disagreement 2.0 to 3.2 times the effect it is meant to correct, at every cap (band_J 2.297e+06). Two members carry measured boundaries of their own: the Sapienza exponent changes sign at phi = 17.4143 deg of wall angle (closed form on its own coefficients) and past it returns p_b > p_w, which on our member is 25 of 81 stations; Rocketdyne's degenerates EXACTLY to p_b = 0 at the ideal length, i.e. into NASA SP-8120's 1976 assumption (base term -1.2321e+03 N, identical to the zero member). Read outside their fitted class the two cold MODEL-VAL members and the Sapienza one put their argmax at 1.2 percent of the length with base terms of +1.53e+07, +1.43e+07 and +1.94e+07 N -- 13, 12 and 17 percent of J. On our member, in class, truncation does not pay: the argmax is at the last station for every admissible closure and the base term there is a depression of -9.91e+02 N. The truncation stationarity of our own functional, dJ/dx = 2 pi y [y'(p_b - p_w) + y p_b'/2], is NOT Veen's corner relation (an optimality against a compatibility; 2.87 m apart on this member), and the wake regime at our operating point is unsettled: PR 33.23 equals the member's own design PR, so Hagemann's criterion reads the transition itself. S31 2026-09-18, ON MEASURED POINTS (stage data 7/7): our conical, cylindrical, Sapienza and chutkey members reproduce Chutkey 2014's own four model columns at every point to one printed digit (34 values, worst 7.6e-05) -- the members ARE the literature's relations; graded on p_b/p_lip: chutkey mean -0.02 rms 0.25 [-0.40, +0.43], cylindrical +0.23 / 0.31, conical +0.33 / 0.43, Sapienza +0.84 / 0.98 ABOVE at every posed point, the INCUMBENT Veen -0.63 mean [-0.82, -0.41] BELOW at every point (2 to 5 times too deep), Panov-Shvets [-0.74, +1.73] on a closed wake whose measured p_b/p_a spans 0.28-3.04 (a closure on p_a is structurally wrong in the closed regime); measured p_b/p_lip 0.510 +- 0.075 over M_lip 2.61-5.35, so the closed-wake base sits at HALF the lip pressure and Veen's M^-1.3 fall-off is not in the data; the WG10 bracket [+19, -15] holds for NO member on this dataset. On our own member (band 3/3) the IDEAL-THRUST BOUND -- J_trunc = core + base may never exceed the untruncated isentropic J_full -- grades the members in the same order as the data without any data: chutkey's central value breaks it only at 12.5 percent retained (+4.51e+05 N, below the 20 percent shortest plug it was fitted on, where it already over-reads its own points by +20..+43 percent), conical at 12.5 and 25, cylindrical at 12.5, 25 and 37.5, none with its whole measured interval. With the chutkey member the closures still span 1.24e+07 / 4.82e+06 / 2.09e+06 / 8.86e+05 / 3.44e+05 N at the caps 12.5-62.5 percent (the measured bands are wider than the quoted one): the S30 verdict stands, the base term is now carried with a measured sign and band."
