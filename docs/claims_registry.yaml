  falsifier: "stage rao: R-0 (fan certified), R-2 (the truncated ideal member with their closure within 1 percent of Rao's thrust -- the ideal-bound reading); R-1/R-3 as first posed (mass-consistent lip, y_D vs Table 3) fail by construction and are to be re-posed as readings. S33: R-4 (Table 3 below the member at every row, the gap monotone -- a row on or above it would restore S31's sentence) and R-5 (the printed angle at x 5.33714 a one-digit misprint: the printed column not monotone, the corrected one monotone and against the member where its neighbours are); run of record 2026-09-22: 4/6, 12.6 s. Stage opt: O-1 (the walk's best design certified), O-2 (thrust within 1 percent of the paper's, their shear being 0.2 percent), then the contour against Tables 3/2 and the base radius y_D. A walk that does not bring the base down from the planar streamline's 3.2 in, or a thrust above the ideal bound 34,390 lbf, falsifies the row. Stage grad: G-1 (the AD gradient against central differences on the FD ladder, at the optimum and on the certification floor), G-2 (no shape knot buys more than the band on a move over its stay class), G-3 (the inlet knot does), G-4 (the perturbed walk's tip residue is worth less than the band), G-5 (the prices are grid-stable under (K,N) -> (2K-1,2N-1)). An AD gradient that missed the differences beyond the ladder's scatter would void every walk of this row; a shape knot buying more than the band would mean their contour is NOT stationary for us; a price that moved with the grid by more than the band would mean the walk optimises the mesh. Runs of record 2026-09-22: 4/5 at (81,41) with the band from (161,81) (G-3 FAIL by 0.78 of the band), 5/5 at (161,81) with the band from (321,161), 1311.8 s. Stage class: K-1 (the incumbent of the posing has NO folded resolved cell -- a criterion that called IT folded would be mis-posed and every other row of this stage void), K-2 (their contour as we march it does), K-3 (the walk-parking cert band sits in a healthy neighbourhood: conditioning), K-4 (the 2.96e8 does not: a fold), K-5 (the folded fraction is grid-stable within the census's own granularity). K-6 (the push downstream of the first fold exceeds the span of the paper's own grid: the fold reaches the verdicts), K-7 (their contour is steepest upstream of our cut while ours is steepest inside the field, and the first fold is downstream of OUR turn), K-8 (our wall angle oscillates about their printed angle where theirs is monotone), K-9 (the cut cannot hold their mass and their wall at once: their wall at the cut moves the mass 19.2 percent, against the 1 percent of the thrust gate). Stage throat: T-1/T-2 (known answers of the transcription against the paper's text: the 0.5-in arc, the 12.0-in length T -> D), T-3 (A -> E normal to the injection), T-4 (R_c inside the kernel's declared domain: FAILS at 0.703), T-5 (the series converges at that throat), T-6 (their mass a physical discharge of A -> E: FAILS at C_d 1.029). Run of record 2026-09-22: 4/6, 0.3 s; the two FAILs are the row's findings, not defects of the stage. Stage kernel: H-0 (the corner fan certifies), H-1 (the start line is space-like), H-2 (the march certifies), H-3 (mass conserved to the last column within the march's class), H-4 (no folded resolved cell), H-5 (the discharge is physical), H-6 (J/mdot within the thrust class); and the attribution's own rejector: an R_c-4 control that had ALSO lost 7 percent would have sent the cause to the hand-over, not to the series. Runs of record 2026-09-22: 4/7 on their wall at every cut, 5/7 on the parabola at R_c 4.0 (H-3 passing at 9.6e-3). K-10 (waviness is the folding mechanism: zero turns and zero folds on the incumbent, folds on every design with a turn, their own contour monotone -- a design with no turn that folded, or a wavy one that did not, would send the mechanism elsewhere). Run of record 2026-09-22: 10/10, 174.1 s (re-run S33 with the census factored to module level: 10/10, the JSON byte-identica